---
# WARM-boot variant of target-cluster.yaml — target time-to-ready <40s.
#
# Combines two ideas:
#   1. WARM IMAGE (BAKE_MODE=warm, image tag :warm). The golden image was baked
#      with a FIXED custom CA set (03-target-cluster/warm-ca/) and a fixed token,
#      with the API VIP in the serving-cert SAN. Its etcd DB, certs, and system
#      charts are fully initialized. First boot does NO `k3s server
#      --cluster-reset` and NO cert purge — it just starts k3s from warm state.
#   2. PARALLEL WORKER (from target-cluster-parallel.yaml). The worker boots
#      alongside the control plane via a static bootstrap secret + skip-preflight,
#      so it is not serialized behind the CP.
#
# Why no cluster-reset / cert purge: KThrees injects three CAs into the CP
# (server-ca, client-ca, etcd/server-ca) from secrets it looks up by name. Those
# secrets are PRE-SEEDED with the same material baked into the image
# (scripts/seed-cluster-secrets.sh), so the CAs KThrees writes match the baked
# leaves exactly — no conflict. Safe only because exactly ONE target-cluster
# runs at a time (reused etcd cluster identity never collides).
#
# ── REQUIRED ORDER ──────────────────────────────────────────────────────────
#   ./scripts/seed-cluster-secrets.sh        # seed ca/cca/etcd/token FIRST
#   kubectl apply -f 03-target-cluster/target-cluster-warm.yaml
# If you skip the seed step, KThrees generates random CAs/token that DON'T match
# the baked leaves and the CP will fail to come up cleanly.
#
# DEMO USE ONLY: fixed CA + token are committed (see warm-ca/). Same posture as
# target-cluster-parallel.yaml.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: target-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.42.0.0/16
    services:
      cidrBlocks:
        - 10.43.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: KThreesControlPlane
    name: target-cluster-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtCluster
    name: target-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: target-cluster
  namespace: default
spec:
  controlPlaneServiceTemplate:
    metadata:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "172.18.255.215"
    spec:
      type: LoadBalancer
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlane
metadata:
  name: target-cluster-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.31.4+k3s1
  kthreesConfigSpec:
    agentConfig:
      airGapped: true
    serverConfig:
      cloudProviderName: ""
      disableComponents:
        - servicelb
        - traefik
      tlsSan:
        - 172.18.255.215
    # WARM path preK3sCommands:
    #   1. SSH key.
    #   2. Force the SQLite/kine datastore: strip KThrees's `cluster-init: true`
    #      and drop the etcd-proxy manifest. The warm image was baked with plain
    #      `k3s server` (SQLite), and SQLite is IP-INDEPENDENT — unlike embedded
    #      etcd, whose member URL is bound to the bake VM's IP and would force a
    #      `--cluster-reset` on every new node. With SQLite the baked state is
    #      portable as-is, so first boot needs no reset and no CA purge (seeded
    #      CAs already match the baked leaves).
    preK3sCommands:
      - mkdir -p /home/ubuntu/.ssh && echo 'ssh-rsa  mahipal' > /home/ubuntu/.ssh/authorized_keys && chown -R ubuntu:ubuntu /home/ubuntu/.ssh && chmod 700 /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys
      - sed -i '/cluster-init/d' /etc/rancher/k3s/config.yaml
      - rm -f /var/lib/rancher/k3s/server/manifests/etcd-proxy.yaml
    # NOTE: ordering matters. By the time postK3sCommands run, install.sh has
    # already started k3s, whose ExecStartPre created the .firstboot-done
    # sentinel — so the sentinel-guarded start line below hits `exit 0` and
    # swallows anything after it. The ghost-node cleanup must come FIRST.
    postK3sCommands:
      # Reap the bake VM's leftover Node object (carried in the warm SQLite
      # state) once the API is up. Transient unit so it survives cloud-init.
      - systemd-run --unit=warm-ghost-node-cleanup --no-block /bin/bash -c 'for i in $(seq 1 60); do /usr/local/bin/k3s kubectl delete node ubuntu-bake-vm-warm --ignore-not-found && break; sleep 2; done'
      # Sentinel-guarded start: the k3s.service ExecStartPre drop-in (baked in)
      # runs the LIGHT warm firstboot, which only clears stale node identity.
      - test -f /var/lib/rancher/k3s/.firstboot-done && exit 0 || (systemctl daemon-reload && systemctl enable k3s && systemctl start k3s)
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KubevirtMachineTemplate
      name: target-cluster-cp
      namespace: default
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: target-cluster-cp
  namespace: default
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: none
      virtualMachineTemplate:
        metadata:
          namespace: default
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 4
                memory:
                  guest: 8Gi
                ioThreadsPolicy: shared
                devices:
                  disks:
                    - disk:
                        bus: virtio
                      name: systemdisk
                  interfaces:
                    - bridge: {}
                      name: default
              networks:
                - name: default
                  pod: {}
              volumes:
                - containerDisk:
                    image: 172.18.0.2:5000/ubuntu-noble-k3s:warm
                  name: systemdisk
---
# Static worker bootstrap (identical to target-cluster-parallel.yaml). Embeds the
# fixed WARM token so the agent can join the moment the CP API answers. The k3s
# agent retries the server VIP until it is reachable.
apiVersion: v1
kind: Secret
metadata:
  name: target-cluster-workers-bootstrap
  namespace: default
type: cluster.x-k8s.io/secret
stringData:
  value: |
    #cloud-config

    write_files:
    -   path: /etc/rancher/k3s/config.yaml
        owner: root:root
        permissions: '0640'
        content: |
          kubelet-arg:
          - cloud-provider=external
          server: https://172.18.255.215:6443
          token: f00dcafef00dcafef00dcafef00dcafe

    runcmd:
      - "mkdir -p /home/ubuntu/.ssh && echo 'ssh-rsa  mahipal' > /home/ubuntu/.ssh/authorized_keys && chown -R ubuntu:ubuntu /home/ubuntu/.ssh && chmod 700 /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys"
      - INSTALL_K3S_SKIP_DOWNLOAD=true INSTALL_K3S_EXEC='agent' sh /opt/install.sh && mkdir -p /run/cluster-api && echo success > /run/cluster-api/bootstrap-success.complete
      - "systemctl daemon-reload && systemctl enable k3s-agent && systemctl start k3s-agent"
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: target-cluster-workers
  namespace: default
  annotations:
    # Skip CAPI's "ControlPlaneIsStable" preflight so the worker MachineSet scales
    # up immediately and the worker VM boots in parallel with the control plane.
    machineset.cluster.x-k8s.io/skip-preflight-checks: All
spec:
  clusterName: target-cluster
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: target-cluster
      version: v1.31.4+k3s1
      bootstrap:
        dataSecretName: target-cluster-workers-bootstrap
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
        name: target-cluster-workers
        namespace: default
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: target-cluster-workers
  namespace: default
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: none
      virtualMachineTemplate:
        metadata:
          namespace: default
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 4
                memory:
                  guest: 6Gi
                ioThreadsPolicy: shared
                devices:
                  disks:
                    - disk:
                        bus: virtio
                      name: systemdisk
                  interfaces:
                    - bridge: {}
                      name: default
              networks:
                - name: default
                  pod: {}
              volumes:
                - containerDisk:
                    image: 172.18.0.2:5000/ubuntu-noble-k3s:warm
                  name: systemdisk
