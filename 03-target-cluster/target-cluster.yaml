---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: target-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.42.0.0/16
    services:
      cidrBlocks:
        - 10.43.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: KThreesControlPlane
    name: target-cluster-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtCluster
    name: target-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: target-cluster
  namespace: default
spec:
  controlPlaneServiceTemplate:
    metadata:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "172.18.255.215"
    spec:
      type: LoadBalancer
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlane
metadata:
  name: target-cluster-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.31.4+k3s1
  kthreesConfigSpec:
    serverConfig:
      cloudProviderName: ""
      disableComponents:
        - servicelb
        - traefik
      tlsSan:
        - 172.18.255.215
    preK3sCommands:
      - |
        # Fix network: write systemd-networkd config matching by interface name
        # (cloud-init netplan matches by MAC which can change on VM restart)
        mkdir -p /etc/systemd/network
        cat > /etc/systemd/network/10-enp1s0.network << 'NETEOF'
        [Match]
        Name=enp1s0

        [Network]
        DHCP=yes
        LinkLocalAddressing=ipv6

        [DHCP]
        RouteMetric=100
        UseMTU=true
        NETEOF
        sed -i 's/^        //' /etc/systemd/network/10-enp1s0.network
        systemctl restart systemd-networkd
        # Wait for DHCP lease
        for i in $(seq 1 30); do
          ip addr show enp1s0 | grep -q 'inet ' && break
          sleep 1
        done
      - |
        useradd -m -s /bin/bash -G sudo ubuntu 2>/dev/null || true
        echo 'ubuntu:ubuntu' | chpasswd
        mkdir -p /home/ubuntu/.ssh
        echo 'ssh-rsa  mahipal@mahipal-proart13' > /home/ubuntu/.ssh/authorized_keys
        chown -R ubuntu:ubuntu /home/ubuntu/.ssh
        chmod 700 /home/ubuntu/.ssh
        chmod 600 /home/ubuntu/.ssh/authorized_keys
        echo 'ubuntu ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ubuntu
        sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        systemctl restart sshd 2>/dev/null || true
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KubevirtMachineTemplate
      name: target-cluster-cp
      namespace: default
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: target-cluster-cp
  namespace: default
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: default
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 2
                memory:
                  guest: 4Gi
                devices:
                  disks:
                    - disk:
                        bus: virtio
                      name: systemdisk
                  interfaces:
                    - masquerade: {}
                      name: default
              networks:
                - name: default
                  pod: {}
              volumes:
                - dataVolume:
                    name: systemdisk-dv
                  name: systemdisk
          dataVolumeTemplates:
            - metadata:
                name: systemdisk-dv
              spec:
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 17Gi
                source:
                  pvc:
                    namespace: default
                    name: ubuntu-noble-dv
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: target-cluster-workers
  namespace: default
spec:
  clusterName: target-cluster
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: target-cluster
      version: v1.31.4+k3s1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KThreesConfigTemplate
          name: target-cluster-workers
          namespace: default
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
        name: target-cluster-workers
        namespace: default
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: target-cluster-workers
  namespace: default
spec:
  template:
    spec:
      agentConfig: {}
      preK3sCommands:
        - |
          # Fix network: write systemd-networkd config matching by interface name
          # (cloud-init netplan matches by MAC which can change on VM restart)
          mkdir -p /etc/systemd/network
          cat > /etc/systemd/network/10-enp1s0.network << 'NETEOF'
          [Match]
          Name=enp1s0

          [Network]
          DHCP=yes
          LinkLocalAddressing=ipv6

          [DHCP]
          RouteMetric=100
          UseMTU=true
          NETEOF
          sed -i 's/^          //' /etc/systemd/network/10-enp1s0.network
          systemctl restart systemd-networkd
          # Wait for DHCP lease
          for i in $(seq 1 30); do
            ip addr show enp1s0 | grep -q 'inet ' && break
            sleep 1
          done
        - |
          # Redirect proxy connections from local 10.0.2.2:6443 to LB IP
          # (k3s agent tries to connect to server's node-ip which is 10.0.2.2 in masquerade)
          iptables -t nat -A OUTPUT -d 10.0.2.2 -p tcp --dport 6443 -j DNAT --to-destination 172.18.255.215:6443
        - |
          useradd -m -s /bin/bash -G sudo ubuntu 2>/dev/null || true
          echo 'ubuntu:ubuntu' | chpasswd
          mkdir -p /home/ubuntu/.ssh
          echo 'ssh-rsa  mahipal@mahipal-proart13' > /home/ubuntu/.ssh/authorized_keys
          chown -R ubuntu:ubuntu /home/ubuntu/.ssh
          chmod 700 /home/ubuntu/.ssh
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          echo 'ubuntu ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ubuntu
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          systemctl restart sshd 2>/dev/null || true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: target-cluster-workers
  namespace: default
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: default
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 2
                memory:
                  guest: 4Gi
                devices:
                  disks:
                    - disk:
                        bus: virtio
                      name: systemdisk
                  interfaces:
                    - masquerade: {}
                      name: default
              networks:
                - name: default
                  pod: {}
              volumes:
                - dataVolume:
                    name: systemdisk-dv
                  name: systemdisk
          dataVolumeTemplates:
            - metadata:
                name: systemdisk-dv
              spec:
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 17Gi
                source:
                  pvc:
                    namespace: default
                    name: ubuntu-noble-dv
