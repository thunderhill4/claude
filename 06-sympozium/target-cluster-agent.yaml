# target-cluster-agent — Agent that analyzes the target-cluster
# (k3s deployments, pods, services, istio workloads).
#
# Uses the custom `target-k8s-ops` SkillPack (defined below) which is a
# copy of the built-in k8s-ops sidecar image with KUBECONFIG pointed at
# the target-cluster kubeconfig Secret (created by install-sympozium.sh).

---
apiVersion: sympozium.ai/v1alpha1
kind: SkillPack
metadata:
  name: target-k8s-ops
  namespace: sympozium-system
spec:
  category: kubernetes
  runtimeRequirements:
    minCPU: 100m
    minMemory: 256Mi
  sidecar:
    image: ghcr.io/sympozium-ai/sympozium/skill-k8s-ops:latest
    mountWorkspace: true
    env:
      - name: KUBECONFIG
        value: /etc/target-kube/kubeconfig
    secretRef: target-cluster-kubeconfig
    secretMountPath: /etc/target-kube
    resources:
      cpu: 100m
      memory: 256Mi
  skills:
    - name: target-k8s-ops
      description: "kubectl against the target-cluster using the mounted kubeconfig"
      content: |
        # Target-Cluster Kubernetes Operations

        You have kubectl access to the target k3s cluster via the kubeconfig
        mounted at `/etc/target-kube/kubeconfig` (the `KUBECONFIG` environment
        variable is already set). You can inspect deployments, pods, services,
        namespaces, events, Istio workloads, and any other resources in the
        target cluster.

        The target cluster is a k3s cluster provisioned as KubeVirt VMs on the
        management cluster (cluster2). It is reachable at its own API server
        endpoint (see the mounted kubeconfig).

---
# NOTE: a SympoziumInstance companion object used to be kept here so kubeui's
# agent dropdown could list it, but the `sympoziuminstances.sympozium.ai` CRD
# is no longer shipped by the Sympozium chart (verified absent as of 0.10.38
# through 0.10.47) — applying one now fails admission outright. See
# cluster2-agent.yaml for the equivalent note and the dropdown fallback.
#
# Agent CR — the reconciled object (spec.skills=[web-endpoint] drives
# declarative serving). Carries model, policy, and the environment briefing.
#
# target-k8s-ops is listed as a TOOL skill: as of 0.10.47 the apiserver copies
# an Agent's spec.skills onto the runs it creates, so tool sidecars must be
# declared here rather than injected by the skills-webhook. See the long note in
# cluster2-agent.yaml for what changed and why the webhook stopped firing.
# target-k8s-ops mounts the target-cluster kubeconfig, so this agent's kubectl
# reaches INSIDE the target k3s cluster rather than cluster2.
# Verified: a chat run returned both real target node names, matching a
# kubeconfig-mounting probe pod byte for byte.
apiVersion: sympozium.ai/v1alpha1
kind: Agent
metadata:
  name: target-cluster-agent
  namespace: sympozium-system
spec:
  agents:
    default:
      model: llama3.2
      baseURL: http://host-ollama.sympozium-system.svc.cluster.local:11434/v1
      sandbox:
        enabled: false
  authRefs:
    - provider: ollama
      secret: llm-credentials
  skills:
    - skillPackRef: web-endpoint     # drives declarative serving (requiresServer=true)
    - skillPackRef: target-k8s-ops   # kubectl INSIDE target-cluster, for task (chat) runs
  policyRef: target-reach
  observability:
    enabled: false
  memory:
    enabled: false
    maxSizeKB: 256
    # Environment briefing — keep SHORT (llama3.2). Edit here; re-run the installer.
    systemPrompt: |
      You are the workload operator for "target-cluster", a k3s cluster. Your kubectl talks DIRECTLY to the target cluster's own API via a mounted kubeconfig — you see ITS namespaces, deployments, pods, services, events, and Istio workloads. Use normal commands: kubectl get namespaces; kubectl get pods -A; kubectl get deploy,svc -A.
      Context: target-cluster's nodes are KubeVirt VMs hosted on a separate "cluster2" management cluster (which runs CAPI, KubeVirt, MetalLB, Sympozium). You do NOT operate cluster2 or the VMs themselves — you only see inside the target cluster. cluster1 is another separate cluster you cannot reach. Read-only unless the user explicitly approves a change.
