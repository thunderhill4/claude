server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web terminal WebSocket (must come before the generic /api/ block so
    # the Upgrade/Connection headers are set for the handshake)
    location /api/v1/terminal {
        proxy_pass http://kubeui-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy to backend service
    location /api/ {
        proxy_pass http://kubeui-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for AI chat streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://kubeui-backend:8080;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# AI console: the backend's de-branding proxy for the agent dashboard,
# passed through on its own port (the SPA's absolute /assets and /api paths
# can't share the main server). WebSocket upgrade headers included.
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://kubeui-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
