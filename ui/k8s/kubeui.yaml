---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeui-backend
  namespace: kubeui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeui-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "events", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machines", "machinedeployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sympozium.ai"]
    resources: ["sympoziuminstances"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeui-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeui-reader
subjects:
  - kind: ServiceAccount
    name: kubeui-backend
    namespace: kubeui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeui-backend
  namespace: kubeui
  labels:
    app: kubeui
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeui
      component: backend
  template:
    metadata:
      labels:
        app: kubeui
        component: backend
    spec:
      serviceAccountName: kubeui-backend
      containers:
        - name: backend
          image: kubeui-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            # Where the backend DIALS the registry, vs what it DISPLAYS.
            # 172.18.0.2:5000 is a fixed alias, not a real address — containerd
            # resolves it per-node via certs.d (scripts/fix-registry-hosts.sh),
            # but that mapping does not apply to this process's HTTP client, so
            # dialing the alias always fails. Point REGISTRY_URL at the registry
            # container's actual kind-network IP:
            #   docker inspect -f \
            #     '{{(index .NetworkSettings.Networks "kind").IPAddress}}' registry
            # That IP drifts when containers reconnect, so re-check it after a
            # docker/host restart if the Registry tab shows "disconnected".
            - name: REGISTRY_URL
              value: "http://172.18.0.4:5000"
            - name: REGISTRY_ALIAS
              value: "172.18.0.2:5000"
            - name: SYMPOZIUM_NAMESPACE
              value: "sympozium-system"
            - name: SYMPOZIUM_DEFAULT_AGENT
              value: "cluster2-agent"
            - name: SYMPOZIUM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sympozium-ui-token
                  key: token
                  optional: true
            # Login token the console proxy injects into the embedded
            # dashboard (sympozium-ui-token, NOT the per-agent web-proxy-key).
            - name: SYMPOZIUM_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sympozium-ui-token
                  key: token
                  optional: true
            # Upstream for the console proxy on :8081 — server-side, so
            # in-cluster DNS is fine here.
            - name: SYMPOZIUM_DASHBOARD_URL
              value: "http://sympozium-apiserver.sympozium-system.svc.cluster.local:8080"
            - name: SECURITY_AGENT_URL
              value: "http://security-agent.kubeui.svc.cluster.local:8082"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: console
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeui-backend
  namespace: kubeui
  labels:
    app: kubeui
    component: backend
spec:
  selector:
    app: kubeui
    component: backend
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 8081
      targetPort: console
      name: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeui-frontend
  namespace: kubeui
  labels:
    app: kubeui
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeui
      component: frontend
  template:
    metadata:
      labels:
        app: kubeui
        component: frontend
    spec:
      containers:
        - name: frontend
          image: kubeui-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            # AI console passthrough (nginx server block on 8081 → backend:8081)
            - containerPort: 8081
              name: console
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeui-frontend
  namespace: kubeui
  labels:
    app: kubeui
    component: frontend
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.211"
spec:
  type: LoadBalancer
  selector:
    app: kubeui
    component: frontend
  ports:
    - port: 80
      targetPort: http
      name: http
    # AI console (embedded in the AI tab as http://<LB-IP>:8081)
    - port: 8081
      targetPort: console
      name: console
