---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeui-backend
  namespace: kubeui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeui-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "events", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machines", "machinedeployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeui-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeui-reader
subjects:
  - kind: ServiceAccount
    name: kubeui-backend
    namespace: kubeui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeui-backend
  namespace: kubeui
  labels:
    app: kubeui
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeui
      component: backend
  template:
    metadata:
      labels:
        app: kubeui
        component: backend
    spec:
      serviceAccountName: kubeui-backend
      containers:
        - name: backend
          image: kubeui-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAGENT_AGENT_NAME
              value: "k8s-agent"
            - name: KAGENT_AGENT_NAMESPACE
              value: "kagent"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeui-backend
  namespace: kubeui
  labels:
    app: kubeui
    component: backend
spec:
  selector:
    app: kubeui
    component: backend
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeui-frontend
  namespace: kubeui
  labels:
    app: kubeui
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeui
      component: frontend
  template:
    metadata:
      labels:
        app: kubeui
        component: frontend
    spec:
      containers:
        - name: frontend
          image: kubeui-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeui-frontend
  namespace: kubeui
  labels:
    app: kubeui
    component: frontend
spec:
  type: NodePort
  selector:
    app: kubeui
    component: frontend
  ports:
    - port: 80
      targetPort: http
      name: http
