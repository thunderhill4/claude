# In-mesh traffic split. Note parentRefs points at a SERVICE, not a Gateway:
# this route governs east-west traffic between pods inside the mesh, enforced by
# the waypoint. Same HTTPRoute API as Act 1's north-south edge routing — one API
# for both directions is a large part of the Gateway API pitch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-internal-split
  namespace: demo-apps
spec:
  parentRefs:
    - kind: Service
      group: ""
      name: echo
      port: 80
  rules:
    - backendRefs:
        - name: echo-v1
          port: 80
          weight: 50
        - name: echo-v2
          port: 80
          weight: 50
