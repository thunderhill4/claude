# MetalLB pool for cluster1.
#
# CRITICAL: cluster1 and cluster2 share the Docker bridge network `kind`
# (172.18.0.0/16) and both advertise via L2. Their pools MUST NOT overlap or
# the two speakers will fight over the same IPs (ARP flapping, random failures).
#
#   cluster1 -> 172.18.255.200-210   (this file)
#   cluster2 -> 172.18.255.211-220   (01-metallb/metallb-config.yaml)
#
# See the MetalLB IP table in CLAUDE.md before changing anything here.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cluster1-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.255.200-172.18.255.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cluster1-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - cluster1-pool
